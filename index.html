<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Star Wars characters, films, planets and starships using SWAPI.">
  <meta name="theme-color" content="#05070b">
  <title>SWAPI Explorer</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img src="public/images/logo.svg" alt="SWAPI Explorer" class="brand-logo">
        <div>
          <span class="brand-kicker">The Galactic Database</span>
          <h1>SWAPI Explorer</h1>
        </div>
      </div>
      <div class="header-status"><span></span> LIVE DATA</div>
    </div>
  </header>

  <main class="container main-content">
    <section class="hero">
      <p class="eyebrow">STAR WARS API</p>
      <h2>Explore a galaxy of data.</h2>
      <p>Browse Start War Characters, Films, Planets and Starships.<br>
         Select any card to inspect its details.</p>
    </section>

    <section class="controls" aria-label="Resource controls">
      <div id="resource-tabs" class="resource-tabs" role="tablist" aria-label="Star Wars resources">
        <button class="resource-tab active" data-resource="people" role="tab">
          <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="5" r="2.6" />
            <path d="M3 14c0-2.8 2.2-5 5-5s5 2.2 5 5" />
          </svg>
          <span>Characters</span>
        </button>
        <button class="resource-tab" data-resource="films" role="tab"><svg class="btn-icon" viewBox="0 0 16 16"
            aria-hidden="true">
            <rect x="2" y="4" width="12" height="9" rx="1" />
            <path d="M2 4l2.5-2h2L5 4M9 4l2.5-2h2L11 4" />
          </svg>
          <span>Films</span></button>
        <button class="resource-tab" data-resource="planets" role="tab"><svg class="btn-icon" viewBox="0 0 16 16"
            aria-hidden="true">
            <circle cx="8" cy="8" r="4.2" />
            <ellipse cx="8" cy="8" rx="7" ry="2.2" />
          </svg>
          <span>Planets</span></button>
        <button class="resource-tab" data-resource="starships" role="tab"><svg class="btn-icon" viewBox="0 0 16 16"
            aria-hidden="true">
            <path d="M8 1.5c2 1.6 3 4 3 7.5 0 1.3-.3 2.4-.8 3.3H5.8c-.5-.9-.8-2-.8-3.3 0-3.5 1-5.9 3-7.5z" />
            <path d="M5.8 12.3 4 14.5M10.2 12.3 12 14.5" />
            <circle cx="8" cy="7" r="1.1" />
          </svg>
          <span>Starships</span></button>
      </div>

      <div class="jump-control">
        <label for="entity-picker">Jump to</label>
        <select id="entity-picker" aria-label="Jump to a specific entry">
          <option value="" selected disabled>Choose an entry…</option>
        </select>
        <button type="button" id="view-details-btn" disabled><svg class="btn-icon" viewBox="0 0 16 16"
            aria-hidden="true">
            <path d="M1 8s2.8-4.5 7-4.5S15 8 15 8s-2.8 4.5-7 4.5S1 8 1 8z" />
            <circle cx="8" cy="8" r="2" />
          </svg>
          <span>View details</span></button>
      </div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="results" class="results-grid" aria-live="polite"></section>
  </main>

  <div class="modal" id="detailsModal" role="dialog" aria-modal="true" aria-labelledby="detailsModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <p class="modal-kicker">ARCHIVED RECORD</p>
            <h2 id="detailsModalLabel"></h2>
          </div>
          <button type="button" class="modal-close" id="detailsModalCloseBtn" aria-label="Close">×</button>
        </div>
        <div class="modal-body" id="detailsModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="secondary-button" id="detailsModalCloseFooterBtn"><svg class="btn-icon"
              viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 3l10 10M13 3L3 13" />
            </svg>
            <span>Close</span></button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>

</html>
