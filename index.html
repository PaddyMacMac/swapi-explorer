<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWAPI Explorer</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <img src="public/images/logo.svg" alt="SWAPI Explorer emblem" class="brand-logo">
        <span class="brand-text">SWAPI EXPLORER</span>
      </span>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <ul class="nav nav-pills" id="resource-tabs">
        <li class="nav-item">
          <button class="nav-link active d-inline-flex align-items-center gap-1" data-resource="people">
            <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.6"/><path d="M3 14c0-2.8 2.2-5 5-5s5 2.2 5 5"/></svg>
            <span>Characters</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link d-inline-flex align-items-center gap-1" data-resource="films">
            <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="4" width="12" height="9" rx="1"/><path d="M2 4l2.5-2h2L5 4M9 4l2.5-2h2L11 4"/></svg>
            <span>Films</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link d-inline-flex align-items-center gap-1" data-resource="planets">
            <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.2"/><ellipse cx="8" cy="8" rx="7" ry="2.2"/></svg>
            <span>Planets</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link d-inline-flex align-items-center gap-1" data-resource="starships">
            <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c2 1.6 3 4 3 7.5 0 1.3-.3 2.4-.8 3.3H5.8c-.5-.9-.8-2-.8-3.3 0-3.5 1-5.9 3-7.5z"/><path d="M5.8 12.3 4 14.5M10.2 12.3 12 14.5"/><circle cx="8" cy="7" r="1.1"/></svg>
            <span>Starships</span>
          </button>
        </li>
      </ul>

      <div class="d-flex gap-2">
        <select id="entity-picker" class="form-select w-auto" aria-label="Jump to a specific entry">
          <option value="" selected disabled>Jump to…</option>
        </select>
        <button type="button" id="view-details-btn" class="btn btn-outline-warning d-inline-flex align-items-center gap-1" disabled>
          <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8s2.8-4.5 7-4.5S15 8 15 8s-2.8 4.5-7 4.5S1 8 1 8z"/><circle cx="8" cy="8" r="2"/></svg>
          <span>View details</span>
        </button>
      </div>
    </div>

    <div id="status" class="mb-3"></div>
    <div id="results" class="row g-3"></div>
  </div>

  <div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailsModalLabel"></h5>
          <button type="button" class="btn-close" id="detailsModalCloseBtn" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="detailsModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary d-inline-flex align-items-center gap-1" id="detailsModalCloseFooterBtn">
            <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>
            <span>Close</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
